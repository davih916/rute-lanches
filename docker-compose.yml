services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rutelanches}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-rutelanches}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rutelanches}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./public/uploads:/app/public/uploads
      - ./certs:/app/certs
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certbot:/etc/letsencrypt:ro
      - ./nginx/webroot:/var/www/certbot:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal

  # Serviço sob demanda (não fica rodando) para emitir/renovar o certificado
  # HTTPS via desafio HTTP-01. Uso, depois de apontar o DNS pro servidor:
  #   docker compose run --rm certbot certonly --webroot -w /var/www/certbot \
  #     -d seu-dominio.com.br -d www.seu-dominio.com.br \
  #     --email seu-email@exemplo.com --agree-tos --no-eff-email
  # Depois: descomentar o bloco 443 em nginx/default.conf e rodar
  # `docker compose restart nginx`. Renovação: repetir com `renew` no lugar
  # de `certonly ...` (pode agendar no cron do host).
  certbot:
    image: certbot/certbot
    volumes:
      - ./nginx/certbot:/etc/letsencrypt
      - ./nginx/webroot:/var/www/certbot
    networks:
      - internal
    profiles:
      - tools

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge

# Reverse proxy nginx → app (Next.js). Troque "seu-dominio.com.br" pelo
# domínio real antes de subir em produção.
#
# HTTPS: depois de apontar o DNS pro servidor, rode o certbot (ver
# HANDOFF.md/scripts/install.sh) e descomente o bloco "server" de 443 abaixo.

server {
    listen 80;
    server_name seu-dominio.com.br www.seu-dominio.com.br;

    # Necessário pro certbot validar o domínio (challenge HTTP-01).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 15M; # upload de foto de produto / certificado
    }
}

